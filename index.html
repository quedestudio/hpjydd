<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>QUEDE Studio和平精英点单系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .login-area {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .username-input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .username-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #667eea;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #f56565;
        }

        .btn-success {
            background: #48bb78;
        }

        .btn-warning {
            background: #ed8936;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .btn-small {
            padding: 5px 12px;
            font-size: 12px;
        }

        .user-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            background: #f0f0f0;
        }

        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-pending {
            background: #fed7d7;
            color: #742a2a;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #4a5568;
        }

        .tab-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .panel {
            display: none;
            animation: fadeIn 0.3s;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 24px;
            color: #667eea;
            font-weight: 700;
            margin: 10px 0;
        }

        .product-desc {
            color: #718096;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .cart-items,
        .orders-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cart-item,
        .order-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cart-item:last-child,
        .order-card:last-child {
            border-bottom: none;
        }

        .cart-summary {
            background: #f7fafc;
            padding: 20px;
            border-radius: 15px;
            text-align: right;
        }

        .total-price {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin: 10px 0;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-placed {
            background: #bee3f8;
            color: #2c5282;
        }

        .status-unpaid {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-completed {
            background: #c6f6d5;
            color: #22543d;
        }

        .admin-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .admin-section h3 {
            margin-bottom: 15px;
            color: #2d3748;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 10px;
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s;
        }

        .message.show {
            display: block;
        }

        .message-success {
            background: #48bb78;
            color: white;
        }

        .message-error {
            background: #f56565;
            color: white;
        }

        .message-warning {
            background: #ed8936;
            color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }

            .tab-btn {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>🎮 和平精英点单系统 <span style="font-size: 14px;">专业陪玩 · 把把得吃</span></h1>
            <div class="user-info">
                <div class="login-area">
                    <input type="text" id="username" class="username-input" placeholder="输入用户名登录">
                    <button class="btn" onclick="login()">登录/注册</button>
                </div>
                <div id="userStatus" class="user-status status-pending">未登录</div>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('order')">🛒 点单区</button>
            <button class="tab-btn" onclick="switchTab('cart')">🛍️ 购物车 (<span id="cartCount">0</span>)</button>
            <button class="tab-btn" onclick="switchTab('orders')">📋 已下单区</button>
            <button class="tab-btn admin-only" id="adminTabBtn" style="display: none;" onclick="switchTab('admin')">🔧 后台管理</button>
        </div>

        <!-- 点单区 -->
        <div id="orderPanel" class="panel active">
            <div class="products-grid" id="productsGrid">
                <div class="loading">加载商品中...</div>
            </div>
        </div>

        <!-- 购物车 -->
        <div id="cartPanel" class="panel">
            <div class="cart-items" id="cartItems">
                <p style="text-align: center; color: #718096;">购物车是空的</p>
            </div>
            <div class="cart-summary" id="cartSummary" style="display: none;">
                <div>总计金额：</div>
                <div class="total-price" id="totalPrice">¥0</div>
                <button class="btn btn-success" onclick="submitOrder()">提交订单</button>
            </div>
        </div>

        <!-- 已下单区 -->
        <div id="ordersPanel" class="panel">
            <div class="orders-list" id="ordersList">
                <div class="loading">暂无订单</div>
            </div>
        </div>

        <!-- 后台管理 -->
        <div id="adminPanel" class="panel">
            <div class="admin-section">
                <div style="background: #fed7d7; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                    <strong>⚠️ 管理员模式</strong><br>
                    您已进入后台管理，可以管理商品、用户和订单。
                </div>
                <button class="btn btn-danger btn-small" onclick="logoutAdmin()" style="margin-bottom: 20px;">退出管理</button>

                <h3>📦 上架商品</h3>
                <div class="form-group">
                    <label>商品名称</label>
                    <input type="text" id="productName" placeholder="例如：苏尔南一千万">
                </div>
                <div class="form-group">
                    <label>价格（元）</label>
                    <input type="number" id="productPrice" placeholder="30">
                </div>
                <div class="form-group">
                    <label>商品描述</label>
                    <textarea id="productDesc" rows="3" placeholder="详细描述商品内容..."></textarea>
                </div>
                <button class="btn btn-success" onclick="addProduct()">➕ 上架商品</button>
            </div>

            <div class="admin-section">
                <h3>👥 用户审核</h3>
                <div id="userList">加载中...</div>
            </div>

            <div class="admin-section">
                <h3>📊 订单管理</h3>
                <div id="adminOrdersList">加载中...</div>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const GITHUB_USER = 'quedestudio';
        const REPO_NAME = 'hpjydd';
        
        // 全局变量
        let currentUser = null;
        let currentUserStatus = null;
        let cart = [];
        let products = [];
        let adminToken = null;
        
        // ==================== 辅助函数 ====================
        function showMessage(text, type = 'success') {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `message message-${type} show`;
            setTimeout(() => msgDiv.classList.remove('show'), 3000);
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function saveCart() {
            if (currentUser) {
                localStorage.setItem(`cart_${currentUser}`, JSON.stringify(cart));
            }
        }
        
        function loadCart() {
            if (currentUser) {
                const saved = localStorage.getItem(`cart_${currentUser}`);
                cart = saved ? JSON.parse(saved) : [];
                updateCartUI();
            }
        }
        
        function updateCartUI() {
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cartCount').textContent = count;
            
            const cartItemsDiv = document.getElementById('cartItems');
            const cartSummary = document.getElementById('cartSummary');
            
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p style="text-align: center; color: #718096;">购物车是空的</p>';
                cartSummary.style.display = 'none';
                return;
            }
            
            let html = '';
            let total = 0;
            cart.forEach((item, idx) => {
                total += item.price * item.quantity;
                html += `
                    <div class="cart-item">
                        <div>
                            <strong>${escapeHtml(item.name)}</strong><br>
                            ¥${item.price} × ${item.quantity}
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-outline btn-small" onclick="updateQuantity(${idx}, -1)">-</button>
                            <span style="min-width: 30px; text-align: center;">${item.quantity}</span>
                            <button class="btn btn-outline btn-small" onclick="updateQuantity(${idx}, 1)">+</button>
                            <button class="btn btn-danger btn-small" onclick="removeFromCart(${idx})">删除</button>
                        </div>
                    </div>
                `;
            });
            cartItemsDiv.innerHTML = html;
            document.getElementById('totalPrice').textContent = `¥${total.toFixed(2)}`;
            cartSummary.style.display = 'block';
        }
        
        function updateQuantity(idx, delta) {
            const newQty = cart[idx].quantity + delta;
            if (newQty <= 0) {
                cart.splice(idx, 1);
            } else {
                cart[idx].quantity = newQty;
            }
            saveCart();
            updateCartUI();
        }
        
        function removeFromCart(idx) {
            cart.splice(idx, 1);
            saveCart();
            updateCartUI();
        }
        
        function addToCart(product) {
            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            saveCart();
            updateCartUI();
            showMessage(`已添加 ${product.name} 到购物车`, 'success');
        }
        
        // ==================== 公开API ====================
        async function publicFetch(url) {
            const response = await fetch(url, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }
        
        async function loadProducts() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues?labels=product&state=open`;
                const issues = await publicFetch(url);
                products = issues.map(issue => ({
                    id: issue.number,
                    name: issue.title,
                    price: parseFloat(issue.body.match(/价格[：:]\s*(\d+)/)?.[1] || 0),
                    description: issue.body.substring(0, 150)
                }));
                displayProducts();
            } catch (error) {
                console.error('加载商品失败:', error);
                document.getElementById('productsGrid').innerHTML = '<p style="text-align: center; color: #718096;">暂无商品，请联系管理员上架</p>';
            }
        }
        
        function displayProducts() {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: #718096;">暂无商品，请联系管理员上架</p>';
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-title">${escapeHtml(p.name)}</div>
                    <div class="product-price">¥${p.price}</div>
                    <div class="product-desc">${escapeHtml(p.description)}</div>
                    <button class="btn btn-success btn-small" onclick='addToCart(${JSON.stringify(p)})'>🛒 加入购物车</button>
                </div>
            `).join('');
        }
        
        // ==================== 用户登录 ====================
        async function login() {
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showMessage('请输入用户名', 'error');
                return;
            }
            
            currentUser = username;
            
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues?labels=user`;
                const issues = await publicFetch(url);
                const userIssue = issues.find(i => i.title === `【用户】${username}`);
                
                if (userIssue) {
                    const hasActive = userIssue.labels.some(l => l.name === 'active');
                    currentUserStatus = hasActive ? 'active' : 'pending';
                    showMessage(`欢迎回来，${username}！状态：${hasActive ? '已激活' : '待审核'}`, 
                               hasActive ? 'success' : 'warning');
                } else {
                    // 新用户注册 - 需要管理员在后台创建
                    showMessage(`账户 ${username} 已申请，请联系管理员审核`, 'warning');
                    currentUserStatus = 'pending';
                }
                
                updateUserUI();
                loadCart();
                loadOrders();
            } catch (error) {
                console.error('登录失败:', error);
                showMessage('登录失败，请重试', 'error');
            }
        }
        
        function updateUserUI() {
            const statusDiv = document.getElementById('userStatus');
            if (currentUserStatus === 'active') {
                statusDiv.innerHTML = `✅ ${currentUser} (已激活)`;
                statusDiv.className = 'user-status status-active';
            } else {
                statusDiv.innerHTML = `⏳ ${currentUser} (待审核)`;
                statusDiv.className = 'user-status status-pending';
            }
        }
        
        async function loadOrders() {
            if (!currentUser) return;
            
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues?labels=order`;
                const issues = await publicFetch(url);
                const userOrders = issues.filter(i => i.body && i.body.includes(`"user":"${currentUser}"`));
                displayOrders(userOrders);
            } catch (error) {
                console.error('加载订单失败:', error);
            }
        }
        
        function displayOrders(orders) {
            const container = document.getElementById('ordersList');
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #718096;">暂无订单</p>';
                return;
            }
            
            container.innerHTML = orders.map(order => {
                try {
                    const data = JSON.parse(order.body);
                    const statusMap = {
                        'placed': ['已下单（待打单）', 'status-placed'],
                        'unpaid': ['未支付（已打完）', 'status-unpaid'],
                        'completed': ['已完成（已付款）', 'status-completed']
                    };
                    const [statusText, statusClass] = statusMap[data.status] || ['未知', 'status-placed'];
                    
                    return `
                        <div class="order-card">
                            <div class="order-header">
                                <span>订单 #${order.number}</span>
                                <span class="order-status ${statusClass}">${statusText}</span>
                            </div>
                            <div style="margin: 10px 0;">
                                ${data.items.map(item => `<div>${escapeHtml(item.name)} × ${item.quantity} = ¥${item.price * item.quantity}</div>`).join('')}
                            </div>
                            <div style="font-weight: bold;">总计：¥${data.total}</div>
                            <div style="font-size: 12px; color: #999; margin-top: 8px;">${new Date(data.timestamp).toLocaleString()}</div>
                        </div>
                    `;
                } catch (e) {
                    return '';
                }
            }).join('');
        }
        
        async function submitOrder() {
            if (!currentUser) {
                showMessage('请先登录', 'error');
                return;
            }
            if (currentUserStatus !== 'active') {
                showMessage('您的账户尚未激活，请联系管理员审核', 'error');
                return;
            }
            if (cart.length === 0) {
                showMessage('购物车是空的', 'error');
                return;
            }
            
            // 检查管理员是否已登录（有token）
            if (!adminToken) {
                showMessage('请先让管理员登录后台，才能提交订单', 'warning');
                return;
            }
            
            const totalAmount = cart.reduce((s, i) => s + i.price * i.quantity, 0);
            const orderData = {
                user: currentUser,
                items: cart,
                total: totalAmount,
                timestamp: new Date().toISOString(),
                status: 'placed'
            };
            
            try {
                await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues`, {
                    method: 'POST',
                    body: JSON.stringify({
                        title: `【订单】${currentUser} - ${new Date().toLocaleString()}`,
                        body: JSON.stringify(orderData),
                        labels: ['order', 'placed']
                    })
                });
                
                cart = [];
                saveCart();
                updateCartUI();
                showMessage('订单提交成功！', 'success');
                loadOrders();
                switchTab('orders');
            } catch (error) {
                console.error('提交订单失败:', error);
                showMessage('订单提交失败，请重试', 'error');
            }
        }
        
        // ==================== 管理员功能 ====================
        function showAdminLogin() {
            const token = prompt('请输入GitHub Token以进入后台管理：\n\n（需要repo权限）');
            if (token) {
                adminToken = token.trim();
                sessionStorage.setItem('admin_token', adminToken);
                document.getElementById('adminTabBtn').style.display = 'inline-block';
                showMessage('管理员模式已启用', 'success');
                loadAdminPanel();
                switchTab('admin');
            }
        }
        
        function logoutAdmin() {
            adminToken = null;
            sessionStorage.removeItem('admin_token');
            document.getElementById('adminTabBtn').style.display = 'none';
            showMessage('已退出管理员模式', 'success');
            if (document.getElementById('orderPanel').classList.contains('active')) {
                // 已经在点单区
            } else {
                switchTab('order');
            }
        }
        
        async function adminFetch(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: {
                    'Accept': 'application/vnd.github.v3+json',
                    'Authorization': `token ${adminToken}`,
                    ...options.headers
                }
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        }
        
        async function loadAdminPanel() {
            if (!adminToken) return;
            
            try {
                // 加载用户
                const users = await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues?labels=user`);
                const pendingUsers = users.filter(u => !u.labels.some(l => l.name === 'active') && u.state === 'open');
                const activeUsers = users.filter(u => u.labels.some(l => l.name === 'active') && u.state === 'open');
                
                document.getElementById('userList').innerHTML = `
                    <h4>📌 待审核用户 (${pendingUsers.length})</h4>
                    ${pendingUsers.map(u => `
                        <div class="user-item">
                            <span>👤 ${escapeHtml(u.title.replace('【用户】', ''))}</span>
                            <button class="btn btn-success btn-small" onclick="approveUser(${u.number})">✓ 审核通过</button>
                        </div>
                    `).join('') || '<p>✅ 暂无待审核用户</p>'}
                    <h4 style="margin-top: 20px;">✅ 已激活用户 (${activeUsers.length})</h4>
                    ${activeUsers.map(u => `
                        <div class="user-item">
                            <span>👤 ${escapeHtml(u.title.replace('【用户】', ''))}</span>
                            <button class="btn btn-danger btn-small" onclick="deleteUser(${u.number})">删除</button>
                        </div>
                    `).join('') || '<p>暂无激活用户</p>'}
                `;
                
                // 加载订单
                const orders = await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues?labels=order`);
                document.getElementById('adminOrdersList').innerHTML = orders.map(o => {
                    try {
                        const data = JSON.parse(o.body);
                        return `
                            <div class="order-card">
                                <div><strong>${escapeHtml(data.user)}</strong> - 订单 #${o.number}</div>
                                <div>金额：¥${data.total}</div>
                                <div>商品：${data.items.map(i => i.name).join(', ')}</div>
                                <div style="display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
                                    <select id="status_${o.number}" style="padding: 5px; border-radius: 5px;">
                                        <option value="placed" ${data.status === 'placed' ? 'selected' : ''}>已下单（未打单）</option>
                                        <option value="unpaid" ${data.status === 'unpaid' ? 'selected' : ''}>未支付（已打完）</option>
                                        <option value="completed" ${data.status === 'completed' ? 'selected' : ''}>已完成（已付款）</option>
                                    </select>
                                    <button class="btn btn-success btn-small" onclick="updateOrderStatus(${o.number})">更新状态</button>
                                </div>
                            </div>
                        `;
                    } catch(e) { return ''; }
                }).join('') || '<p>暂无订单</p>';
                
            } catch (error) {
                console.error('加载管理面板失败:', error);
                document.getElementById('userList').innerHTML = '<p style="color: red;">加载失败，请检查Token权限</p>';
            }
        }
        
        async function approveUser(issueNumber) {
            try {
                await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues/${issueNumber}/labels`, {
                    method: 'POST',
                    body: JSON.stringify({ labels: ['active'] })
                });
                showMessage('用户审核通过！', 'success');
                loadAdminPanel();
            } catch (error) {
                showMessage('审核失败', 'error');
            }
        }
        
        async function deleteUser(issueNumber) {
            if (!confirm('确定删除该用户吗？')) return;
            try {
                await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues/${issueNumber}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ state: 'closed' })
                });
                showMessage('用户已删除', 'success');
                loadAdminPanel();
            } catch (error) {
                showMessage('删除失败', 'error');
            }
        }
        
        async function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const price = document.getElementById('productPrice').value;
            const desc = document.getElementById('productDesc').value.trim();
            
            if (!name || !price) {
                showMessage('请填写商品名称和价格', 'error');
                return;
            }
            
            try {
                await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues`, {
                    method: 'POST',
                    body: JSON.stringify({
                        title: name,
                        body: `价格: ${price}\n\n描述: ${desc}\n\n上架时间：${new Date().toLocaleString()}`,
                        labels: ['product', 'active']
                    })
                });
                showMessage('商品上架成功！', 'success');
                document.getElementById('productName').value = '';
                document.getElementById('productPrice').value = '';
                document.getElementById('productDesc').value = '';
                loadProducts();
            } catch (error) {
                showMessage('上架失败', 'error');
            }
        }
        
        async function updateOrderStatus(issueNumber) {
            const select = document.getElementById(`status_${issueNumber}`);
            const newStatus = select.value;
            
            try {
                const issue = await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues/${issueNumber}`);
                const data = JSON.parse(issue.body);
                data.status = newStatus;
                
                await adminFetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/issues/${issueNumber}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ body: JSON.stringify(data) })
                });
                showMessage('订单状态已更新', 'success');
                loadAdminPanel();
                if (currentUser) loadOrders();
            } catch (error) {
                showMessage('更新失败', 'error');
            }
        }
        
        // ==================== 标签页切换 ====================
        function switchTab(tabName) {
            const panels = ['order', 'cart', 'orders', 'admin'];
            panels.forEach(p => {
                const el = document.getElementById(`${p}Panel`);
                if (el) el.classList.remove('active');
            });
            document.getElementById(`${tabName}Panel`).classList.add('active');
            
            // 更新按钮样式
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (tabName === 'orders' && currentUser) loadOrders();
            if (tabName === 'admin' && adminToken) loadAdminPanel();
        }
        
        // ==================== 初始化 ====================
        async function init() {
            const savedToken = sessionStorage.getItem('admin_token');
            if (savedToken) {
                adminToken = savedToken;
                document.getElementById('adminTabBtn').style.display = 'inline-block';
            }
            
            // 添加管理员入口按钮
            const userInfoDiv = document.querySelector('.user-info');
            const adminBtn = document.createElement('button');
            adminBtn.textContent = '🔐 管理员入口';
            adminBtn.className = 'btn btn-outline btn-small';
            adminBtn.style.marginLeft = '10px';
            adminBtn.onclick = showAdminLogin;
            userInfoDiv.appendChild(adminBtn);
            
            await loadProducts();
        }
        
        init();
    </script>
</body>
</html>
